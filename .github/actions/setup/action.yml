name: Setup build environment
description: Install the system libraries hush links against and restore the cargo cache

runs:
  using: composite
  steps:
    # whisper-rs-sys builds whisper.cpp with cmake and, for the vulkan feature,
    # compiles its shaders with glslc against the Vulkan headers; cpal needs ALSA
    # headers; the overlay's GLFW build and x11rb need the X11 and GL files.
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake pkg-config \
          libasound2-dev \
          libx11-dev libxi-dev libxtst-dev libxcursor-dev \
          libxrandr-dev libxinerama-dev libgl1-mesa-dev \
          libvulkan-dev
        # Ubuntu 22.04, which the release job uses for its glibc floor, has no
        # glslc package; LunarG's Vulkan repository ships it as shaderc.
        if apt-cache show glslc >/dev/null 2>&1; then
          sudo apt-get install -y --no-install-recommends glslc
        else
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$codename.list" \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$codename.list"
          sudo apt-get update
          # ggml-vulkan needs headers newer than jammy's; LunarG's are current.
          sudo apt-get install -y --no-install-recommends shaderc vulkan-headers libvulkan-dev
        fi
        glslc --version | head -n 1
        pkg-config --modversion vulkan
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
