name: macOS CI/CD

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Test on macOS
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-14 = Apple Silicon (M1), macos-13 = Intel
        os: [macos-14, macos-13]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check system information
        run: |
          echo "macOS version:"
          sw_vers
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "CPU info:"
          sysctl -n machdep.cpu.brand_string
          echo ""
          echo "Rust version:"
          rustc --version
          cargo --version

      - name: Run cargo check
        run: cargo check --workspace --all-targets

      - name: Run cargo test (lib)
        run: cargo test --lib --no-default-features

      - name: Run macOS integration tests
        run: cargo test --test macos_integration --no-default-features
        continue-on-error: true  # May fail without GUI/permissions in CI

      - name: Run cargo clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Test device detection
        run: |
          cargo build --release --no-default-features
          ./target/release/hush status --devices || true

  # Build release binaries (only on tags)
  build:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            features: metal
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x64
            features: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-release

      - name: Build release binary
        run: |
          if [ "${{ matrix.features }}" != "" ]; then
            cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
          else
            cargo build --release --target ${{ matrix.target }} --no-default-features
          fi

      - name: Strip binary
        run: |
          strip target/${{ matrix.target }}/release/hush

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf hush-macos-${{ matrix.arch }}.tar.gz hush
          mv hush-macos-${{ matrix.arch }}.tar.gz ../../../

      - name: Create checksum
        run: |
          shasum -a 256 hush-macos-${{ matrix.arch }}.tar.gz > hush-macos-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: hush-macos-${{ matrix.arch }}
          path: |
            hush-macos-${{ matrix.arch }}.tar.gz
            hush-macos-${{ matrix.arch }}.tar.gz.sha256

  # Create universal binary (only on tags)
  universal:
    name: Create Universal Binary
    runs-on: macos-14
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binary
        uses: actions/download-artifact@v3
        with:
          name: hush-macos-arm64
          path: arm64-artifact

      - name: Download x64 binary
        uses: actions/download-artifact@v3
        with:
          name: hush-macos-x64
          path: x64-artifact

      - name: Extract binaries
        run: |
          mkdir -p arm64 x64
          tar xzf arm64-artifact/hush-macos-arm64.tar.gz -C arm64
          tar xzf x64-artifact/hush-macos-x64.tar.gz -C x64

      - name: Create universal binary
        run: |
          lipo -create -output hush arm64/hush x64/hush
          chmod +x hush

      - name: Verify universal binary
        run: |
          echo "File info:"
          file hush
          echo ""
          echo "Lipo info:"
          lipo -info hush

      - name: Create universal archive
        run: |
          tar czf hush-macos-universal.tar.gz hush
          shasum -a 256 hush-macos-universal.tar.gz > hush-macos-universal.tar.gz.sha256

      - name: Upload universal binary
        uses: actions/upload-artifact@v3
        with:
          name: hush-macos-universal
          path: |
            hush-macos-universal.tar.gz
            hush-macos-universal.tar.gz.sha256

  # Create GitHub Release (only on tags)
  release:
    name: Create Release
    runs-on: macos-14
    needs: [build, universal]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/hush-macos-arm64/*.tar.gz
            artifacts/hush-macos-arm64/*.sha256
            artifacts/hush-macos-x64/*.tar.gz
            artifacts/hush-macos-x64/*.sha256
            artifacts/hush-macos-universal/*.tar.gz
            artifacts/hush-macos-universal/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
