name: E2E

# Nightly end-to-end dictation: a test daemon hears recorded speech through a
# PipeWire virtual microphone, and `hush stop --print --json` returns the text.
# It is not a required check. See tests/e2e/README.md.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  e2e:
    name: End-to-end dictation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install PipeWire, WirePlumber, and the ALSA plugin
        run: |
          sudo apt-get install -y --no-install-recommends \
            pipewire pipewire-bin pipewire-alsa wireplumber dbus jq sox
          # The harness hides /dev/uinput from the test daemon in a user
          # namespace, which AppArmor blocks by default on Ubuntu 24.04.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build Hush (CPU)
        run: cargo build
      - name: Restore the cached models
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hush-e2e
          key: hush-e2e-models-${{ hashFiles('src/transcription/models.rs') }}
      - name: Run the end-to-end cases
        env:
          # The runner has no desktop session, so a key that the test daemon
          # types reaches no window.
          HUSH_E2E_ALLOW_UINPUT: "1"
        run: dbus-run-session -- scripts/e2e/headless.sh scripts/e2e/run.sh
      # A cache entry never changes after its first save, so save only a
      # folder that holds every model the cases use.
      - name: Check that every model is in the cache
        id: complete
        if: ${{ !cancelled() && steps.models.outcome == 'success' && steps.models.outputs.cache-hit != 'true' }}
        run: |
          for model in ggml-tiny.bin ggml-silero-v6.2.0.bin parakeet-tdt-0.6b-v3-Q8_0.gguf; do
            [ -s ~/.cache/hush-e2e/"$model" ] || { echo "::notice::$model is missing, so the cache is not saved"; exit 0; }
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      # Also after a failed case, so that the next night does not download
      # the models again.
      - name: Save the models
        if: ${{ !cancelled() && steps.complete.outputs.ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hush-e2e
          key: ${{ steps.models.outputs.cache-primary-key }}
