name: Release

# Builds the packages for a published release, or on demand for an existing
# tag. A dry run keeps the artifacts on the workflow run instead of uploading
# them to the release, which is how the packaging gets exercised before a
# real release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.2.0"
        required: true
        type: string
      dry_run:
        description: "Keep the artifacts on this run instead of uploading to the release"
        type: boolean
        default: true
      build:
        description: "Build the packages (off to only publish an existing release to AUR and COPR)"
        type: boolean
        default: true
      publish_repos:
        description: "Publish the release to AUR and COPR"
        type: boolean
        default: false

permissions: {}

# Never cancel a release build part-way through an upload.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  package:
    name: Build packages
    if: github.event_name == 'release' || inputs.build
    # ubuntu-22.04 sets the glibc floor (2.35) for the tarball and AppImage.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    # transcribe-cpp-sys passes TRANSCRIBE_CMAKE_ARGS to the CMake build of
    # transcribe.cpp and ggml. Without TRANSCRIBE_USE_SYSTEM_BLAS=OFF, the
    # libraries need OpenBLAS when the runner has it. ggml builds one CPU module
    # for each x86 level and picks the best at run time, so no flag sets a CPU
    # floor. HUSH_PACKAGE gives the binary only the package RUNPATH,
    # $ORIGIN/../lib/hush, and makes build.rs refuse a system BLAS.
    env:
      TRANSCRIBE_CMAKE_ARGS: -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF
      HUSH_PACKAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # Inlined rather than ./.github/actions/setup: a local action is read from
      # the checked-out tag, so a fix to it would never reach a release build.
      # dpkg-shlibdeps fills in the .deb's Depends from the linked libraries.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config dpkg-dev \
            libasound2-dev \
            libx11-dev libxi-dev libxtst-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libgl1-mesa-dev \
            libvulkan-dev spirv-headers
          # Ubuntu 22.04 has no glslc package; LunarG's Vulkan repository ships it as shaderc.
          if apt-cache show glslc >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends glslc
          else
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
              | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
            sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$codename.list" \
              "https://packages.lunarg.com/vulkan/lunarg-vulkan-$codename.list"
            sudo apt-get update
            # ggml-vulkan needs headers newer than jammy's; LunarG's are current.
            sudo apt-get install -y --no-install-recommends shaderc vulkan-headers libvulkan-dev spirv-headers
          fi
          glslc --version | head -n 1
          pkg-config --modversion vulkan
      # The cache key includes TRANSCRIBE_CMAKE_ARGS, so a change to the ggml
      # flags never reuses a build made with other flags.
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          env-vars: TRANSCRIBE HUSH
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.62.30
        with:
          tool: cargo-deb@3.8.0
      - run: cargo install --locked cargo-generate-rpm@0.21.0

      - name: Verify the tag matches Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml is at $version but the tag is $TAG"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo build --release --features vulkan

      # Inlined, like the dependencies step, so that a dispatch for an older tag
      # also runs it. The libggml-cpu-*.so modules use AVX-512 and other
      # instructions by design: ggml loads only the module that this CPU runs.
      # The binary, libtranscribe, libggml, libggml-base, and the GPU module
      # always load, so AVX-512 in their C or C++ code means a build for the
      # runner CPU. Rust code targets baseline x86-64, so AVX-512 in a Rust
      # function is a #[target_feature] path that its crate selects after a
      # runtime CPU check, as crc32fast does.
      - name: Check that code that always loads has no AVX-512
        run: |
          set -euo pipefail
          for file in target/release/hush target/release/lib/hush/*; do
            case "${file##*/}" in libggml-cpu-*.so) continue ;; esac
            echo "== $file"
            objdump -d --no-show-raw-insn "$file" | awk '
              /^[0-9a-f]+ <.+>:$/ {
                fn = $0
                sub(/^[0-9a-f]+ </, "", fn)
                sub(/>:$/, "", fn)
                next
              }
              # Only AVX-512 has zmm registers, opmask registers k0 to k7, and
              # xmm16 to xmm31 or ymm16 to ymm31.
              /%zmm|%k[0-7]|%[xy]mm(1[6-9]|2[0-9]|3[01])/ { hits[fn]++ }
              END {
                bad = 0
                for (f in hits) {
                  # Rust v0 mangling, or legacy mangling with its hash
                  if (f ~ /^_R/ || f ~ /^_ZN.*17h[0-9a-f]+E(\.llvm\.[0-9]+)?$/) {
                    printf "allowed: %d AVX-512 instructions in Rust function %s\n", hits[f], f
                  } else {
                    printf "::error::%d AVX-512 instructions in %s\n", hits[f], f
                    bad++
                  }
                }
                if (bad > 0) {
                  printf "::error::%d C or C++ functions use AVX-512. Look for -march=native or a GGML_* flag in TRANSCRIBE_CMAKE_ARGS.\n", bad
                  exit 1
                }
                print "ok: no C or C++ function uses AVX-512"
              }'
          done

      # The tarball is a prefix: bin/hush finds its libraries in lib/hush
      # through the RUNPATH $ORIGIN/../lib/hush, as /usr/bin/hush finds them in
      # /usr/lib/hush in the .deb and the .rpm.
      - name: Build .deb, .rpm, and tarball
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ORIGIN is for the dynamic loader, not the shell.
          want='$ORIGIN/../lib/hush'
          runpath=$(readelf -d target/release/hush | sed -n 's/.*(RUNPATH).*\[\(.*\)\]/\1/p')
          if [ "$runpath" != "$want" ]; then
            echo "::error::the binary's RUNPATH is '$runpath', not '$want'"
            exit 1
          fi
          # cargo-deb strips only some of the libraries, so the libraries of
          # every package get stripped here.
          strip --strip-unneeded --remove-section=.comment target/release/lib/hush/*
          mkdir -p target/dist
          cargo deb --no-build --output target/dist/
          # dpkg-shlibdeps on the unpacked .deb follows $ORIGIN, skips the
          # libraries of the package itself, and lists the system libraries.
          deb="target/dist/hush_${VERSION}-1_amd64.deb"
          tree="$PWD/target/deb-tree"
          dpkg-deb -R "$deb" "$tree"
          mkdir -p target/shlibdeps/debian
          printf 'Source: hush\n\nPackage: hush\nArchitecture: any\n' > target/shlibdeps/debian/control
          depends=$(cd target/shlibdeps && dpkg-shlibdeps -O -xlibgcc "$tree/usr/bin/hush" "$tree"/usr/lib/hush/*.so* \
            | sed -n 's/^shlibs:Depends=//p')
          awk -v depends="Depends: $depends" '/^Description:/ { print depends } !/^Depends:/' \
            "$tree/DEBIAN/control" > target/control
          mv target/control "$tree/DEBIAN/control"
          dpkg-deb --build --root-owner-group -Zxz "$tree" "$deb"
          if [ -z "$depends" ] || [ "$(dpkg-deb -f "$deb" Depends)" != "$depends" ]; then
            echo "::error::the .deb has no Depends from dpkg-shlibdeps"
            exit 1
          fi
          echo "Depends: $depends"
          cargo generate-rpm --output target/dist/
          stage="target/stage/hush-${VERSION}-x86_64-linux"
          mkdir -p "$stage/bin" "$stage/lib/hush"
          cp target/release/hush "$stage/bin/"
          cp target/release/lib/hush/* "$stage/lib/hush/"
          cp LICENSE README.md INSTALL.md \
             packaging/io.github.andymai.hush.desktop packaging/io.github.andymai.hush.svg \
             packaging/70-hush.rules packaging/hush.service "$stage/"
          "$stage/bin/hush" --version
          tar -C target/stage -czf "target/dist/hush-${VERSION}-x86_64-linux.tar.gz" \
             "hush-${VERSION}-x86_64-linux"

      - name: Build AppImage
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          appdir=target/AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/lib/hush" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/scalable/apps"
          cp target/release/hush "$appdir/usr/bin/"
          cp target/release/lib/hush/* "$appdir/usr/lib/hush/"
          cp packaging/io.github.andymai.hush.desktop "$appdir/"
          cp packaging/io.github.andymai.hush.desktop "$appdir/usr/share/applications/"
          cp packaging/io.github.andymai.hush.svg "$appdir/"
          cp packaging/io.github.andymai.hush.svg "$appdir/usr/share/icons/hicolor/scalable/apps/"
          cp packaging/AppRun "$appdir/AppRun"
          # The runner has no FUSE for the tool's own image; extracting it avoids that.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" \
            "target/dist/hush-${VERSION}-x86_64.AppImage"

      - name: Checksums
        run: |
          cd target/dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hush-${{ env.VERSION }}
          path: target/dist/*
          retention-days: 14

  # Separate from the build, so that no cargo build script can mint the OIDC
  # token that signs the attestations.
  publish:
    name: Attest and upload
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hush-${{ needs.package.outputs.version }}
          path: dist

      # A dry run attests too, so that it tests this step before a real release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to the release
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Runs only when the repository variable AUR_PUBLISH is "true". The deploy key
  # secret can exist before an AUR account holds the key, and then every push fails.
  # A failed build also skips publish, so only a skipped package means a
  # repository-only run.
  aur:
    name: Publish to AUR
    needs: [package, publish]
    if: >-
      always() && !cancelled() && vars.AUR_PUBLISH == 'true' &&
      (needs.publish.result == 'success' || needs.package.result == 'skipped') &&
      (github.event_name == 'release' || inputs.publish_repos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fill in the PKGBUILD from the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --pattern SHA256SUMS --dir dist --repo "$GITHUB_REPOSITORY"
          sha=$(grep " hush-${version}-x86_64-linux.tar.gz\$" dist/SHA256SUMS | cut -d' ' -f1)
          sed -e "s/@VERSION@/${version}/" -e "s/@SHA256@/${sha}/" packaging/aur/PKGBUILD.template > PKGBUILD
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cat PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: hush-voice-bin
          pkgbuild: ./PKGBUILD
          commit_username: Andy Aragon
          commit_email: hi@andymai.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}
          ssh_keyscan_types: ed25519

  # Submits a source RPM that repackages the release tarball to COPR once
  # COPR_API_LOGIN, COPR_API_USERNAME, and COPR_API_TOKEN exist.
  copr:
    name: Publish to COPR
    needs: [package, publish]
    if: >-
      always() && !cancelled() &&
      (needs.publish.result == 'success' || needs.package.result == 'skipped') &&
      (github.event_name == 'release' || inputs.publish_repos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_COPR: ${{ secrets.COPR_API_LOGIN != '' && secrets.COPR_API_TOKEN != '' && secrets.COPR_API_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_COPR == 'true'
        with:
          persist-credentials: false
      - name: Build the source RPM
        if: env.HAS_COPR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm python3-pip
          version="${TAG#v}"
          gh release download "$TAG" --pattern "hush-${version}-x86_64-linux.tar.gz" --dir . --repo "$GITHUB_REPOSITORY"
          sed "s/@VERSION@/${version}/g" packaging/hush.spec.template > hush.spec
          rpmbuild -bs --define "_sourcedir $PWD" --define "_srcrpmdir $PWD/srpm" --define "dist %{nil}" hush.spec
          ls -la srpm/
      - name: Submit to COPR
        if: env.HAS_COPR == 'true'
        env:
          COPR_API_LOGIN: ${{ secrets.COPR_API_LOGIN }}
          COPR_API_USERNAME: ${{ secrets.COPR_API_USERNAME }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          set -euo pipefail
          pip3 install --quiet copr-cli
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' \
            "$COPR_API_LOGIN" "$COPR_API_USERNAME" "$COPR_API_TOKEN" > ~/.config/copr
          copr-cli build --nowait "$COPR_API_USERNAME/hush" srpm/*.src.rpm
