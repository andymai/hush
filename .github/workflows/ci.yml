name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .cargo/config.toml links with clang + mold, so both must exist here
      # or every link step fails.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold cmake pkg-config \
            libasound2-dev \
            libx11-dev libxi-dev libxtst-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is gitignored, and audit-check reads ./Cargo.lock.
      - name: Generate lockfile
        run: cargo generate-lockfile

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
