version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # egui_overlay 0.9 requires egui ^0.29, and the settings window shares
      # that egui through eframe, so both stay on 0.29 while the overlay does.
      - dependency-name: eframe
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: egui
        update-types: [version-update:semver-minor, version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The @version tag specifies the Rust version to install, not the
      # action version. Dependabot incorrectly treats it as a version bump.
      - dependency-name: dtolnay/rust-toolchain
    open-pull-requests-limit: 5
