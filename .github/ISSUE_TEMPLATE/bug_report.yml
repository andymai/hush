name: Bug Report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Flatpak
        - .deb
        - .rpm
        - AppImage
        - Tarball or install.sh
        - COPR
        - Nix
        - Built from source
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your distribution, desktop with its version, and GPU
      placeholder: |
        Distro: Fedora 45 / Ubuntu 26.04 / Arch
        Desktop: KDE Plasma 6.5 Wayland / GNOME 51 / Hyprland / X11
        GPU and driver: RTX 4080 (nvidia 580) / RX 7800 (mesa) / none
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: |
        Run `hush report` (in the Flatpak, `flatpak run io.github.andymai.hush report`) and attach the file it writes, or paste it here. It holds the version, the checks, the settings, and the recent log, with your paths, names, and API keys removed.
