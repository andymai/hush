# Built-in defaults. User overrides live in $XDG_CONFIG_HOME/hush/config.toml
# (usually ~/.config/hush/config.toml) and only need the keys they change.

[audio]
sample_rate = 16000
channels = 1
buffer_size = 1024
# device = "default"
max_recording_secs = 600 # stop and transcribe after ten minutes, warning a minute before; 0 disables
silence_stop_secs = 0    # stop a hands-free recording after this many seconds of silence that follow speech; 0 disables
pause_media = false      # pause the media players that play (MPRIS) while you record, and resume them when the recording stops

[transcription]
# Where speech becomes text. local runs whisper.cpp and nothing leaves this
# machine. groq and openai send the audio of each dictation to that service,
# with the window title when context_prompt is on. The key comes from
# GROQ_API_KEY or OPENAI_API_KEY (in the environment or ~/.config/hush/.env).
# openai-compatible sends the audio of each dictation to the URL in
# server_url, such as a whisper.cpp server on your network. Hush adds
# /v1/audio/transcriptions when the URL does not end with it.
# When the service fails, Hush reports the error and never falls back.
backend = "local"                       # local, groq, openai, openai-compatible
groq_model = "whisper-large-v3-turbo"   # or whisper-large-v3
openai_model = "gpt-4o-mini-transcribe" # or gpt-4o-transcribe, whisper-1
server_url = ""                         # openai-compatible: the server address, e.g. "http://localhost:8080/v1"
server_model = ""                       # openai-compatible: the model name that the server expects
server_key_env = ""                     # openai-compatible: the variable that holds the API key; "" sends no key
# model_path = "/path/to/ggml-base.bin"  # derived from model_size when unset
model_size = "base"       # tiny, base, small, medium, large, large-v2, large-v3
language = "en"           # a Whisper language code such as "en" or "de", or "auto" to detect the language you speak
use_gpu = true
beam_size = 5
no_speech_threshold = 0.6
context_prompt = true     # prime Whisper with the focused window's title and learned terms
vad = true                # local only: send Whisper only the speech that the Silero model finds; `hush models download` gets the model
unload_after_mins = 0     # local only: free the model's RAM and GPU memory after this many minutes without a take, and load it again on the next take; 0 never frees it
# Local only: with language = "auto", Whisper picks the most likely of these
# languages, e.g. ["en", "de"]. [] allows every language. Groq, OpenAI, and
# a server detect the language on their own.
detect_languages = []
# Hush drops a transcript that is only one of these phrases, without case and
# punctuation. Whisper invents them for silence or noise. When you set this
# list, it replaces the built-in one ("thanks for watching", "please
# subscribe", subtitle credits, and similar); [] drops nothing.
# drop_phrases = ["thanks for watching", "please subscribe"]

[hotkey]
# In a chord, Ctrl, Shift, Alt, and Super mean the keys that type them with
# the XKB options of the layout: with ctrl:swap_lwin_lctl, Ctrl is the Win
# key. A key alone, such as RightAlt or RightCtrl, is the physical key.
enabled = true
combination = "RightAlt"  # a bare modifier types no character; also "F13", "Mouse4", or a chord like "Ctrl+Shift+Space"
mode = "hold"             # hold: record while held; toggle: press to start, press again to stop
backend = "auto"          # auto: evdev (Wayland and X11), falling back to x11; or "evdev", "x11"
exclusive = false         # true: grab the hotkey's device so applications never see the key or button
mask_menu = true          # true: tap Ctrl when a key of only Alt and Super goes down, so apps open no menu and the desktop opens no launcher
cancel = "Escape"         # discards a recording in progress; "" disables
tap_ms = 300              # shorter presses are taps: a tap discards, a double-tap locks hands-free (hold); a tap locks (toggle)
paste_last = ""           # chord that types the last transcript again, e.g. "Shift+RightAlt"
learn = ""                # chord that adds the selected text to the vocabulary, e.g. "Super+RightAlt"
command = "Ctrl+RightAlt" # Command Mode: hold, speak an instruction, release; the LLM rewrites the selection or the last transcript
# A dictation key for each language, with the same hold, double-tap lock,
# toggle mode, and cancel as the hotkey. The tray menu sets the language of
# the hotkey until you change it again.
languages = {} # e.g. { "Shift+RightAlt" = "de", "F13" = "auto" }
# A dictation key for each writing style (see [styles]), with the same hold,
# double-tap lock, toggle mode, and cancel as the hotkey.
styles = {} # e.g. { "Super+RightAlt" = "verbatim" }
# A key that rewrites the selected text with the prompt of a style, with no
# speech. The style needs polish = true and a prompt, so verbatim cannot
# rewrite. With nothing selected, Hush shows a notice and sends nothing.
rewrite = {} # e.g. { "Super+F" = "formal" }

[feedback]
audio_enabled = true # start, stop, cancel, and warning tones

[insertion]
method = "auto"      # auto: uinput typing, clipboard paste for text uinput cannot type; or "uinput", "clipboard"
typing_delay_ms = 10
# Applications that ignore method. Part of the window class is enough:
# "konsole" matches org.kde.konsole. The History page in the settings window
# shows the class of each application you dictate into.
uinput_apps = []    # always type, e.g. applications where a paste does nothing
clipboard_apps = [] # always paste, e.g. applications that drop typed letters
# The paste chord by window class: "ctrl+v", "ctrl+shift+v", or
# "shift+insert". Without a rule, terminals get ctrl+shift+v; Konsole,
# VS Code, VSCodium, and Cursor get shift+insert; other applications get
# ctrl+v. A rule names the whole class or its last part after a dot:
# "konsole" matches org.kde.konsole, and "st" does not match steam.
paste_keys = {} # e.g. { kitty = "ctrl+v", "org.wezfurlong.wezterm" = "shift+insert" }
# Window classes where Hush presses Enter after it inserts a dictation, for
# example to send a chat message or to run a command: 150 ms after typed
# text, 400 ms after a paste. A rule names the whole class or its last part
# after a dot, as in paste_keys, so a browser rule presses Enter in every tab.
# Hush does not press Enter after a failed or empty insertion, when the
# transcript hook types nothing, after Command Mode, or for `hush stop --print`.
submit_apps = [] # e.g. ["Slack", "kitty"]

[history]
# Each delivered transcript, kept in $XDG_DATA_HOME/hush/history.jsonl
# (readable only by you) for the History page in the settings window.
enabled = true
max_entries = 500 # when there are more, the oldest go
# Keep the audio of each take as FLAC in $XDG_DATA_HOME/hush/audio, next to
# its entry, for this many days. The History page plays it and transcribes it
# again. 0 keeps no audio and deletes the audio that Hush kept. Whatever this
# says, Hush keeps the audio of a take that it could not transcribe for 7 days
# in $XDG_DATA_HOME/hush/recover, for `hush recover`. When the two folders
# hold more than 500 MB, the oldest files go. A hands-free take keeps its
# parts in $XDG_DATA_HOME/hush/parts until Hush types its text; a part that
# fails moves to the recover folder.
keep_audio_days = 0

[profiles]
# Tone by application. The focused window's class picks a profile: terminal
# and editor keep lowercase and skip the trailing period, chat stays casual,
# mail and docs get full sentences. Add window classes to extend a profile.
# In a terminal, each line break becomes a space and Hush removes other
# control characters, so the text cannot run a command. In a chat
# application, Hush types a line break as Shift+Enter, so the line break does
# not send the message, and a paste keeps the line breaks.
enabled = true
terminal = []
editor = []
chat = []
mail = []
docs = []
browser = []
# A default writing style by window class (see [styles]). A rule names the
# whole class or its last part after a dot, as in insertion.paste_keys. A
# style key or `hush start --style` comes first. Hush ignores app_styles when
# enabled is false.
app_styles = {} # e.g. { slack = "casual", "org.kde.konsole" = "verbatim" }

[llm]
# Polishing and Command Mode. auto: a local Ollama server when reachable,
# else Anthropic when ANTHROPIC_API_KEY is set (in the environment or
# ~/.config/hush/.env), else rule-based only. openai-compatible sends the
# text to the URL in server_url, and Hush adds /v1/chat/completions when the
# URL does not end with it. auto never picks it. Only text is sent, never
# audio.
provider = "auto"                     # auto, ollama, anthropic, openai-compatible, none
ollama_url = "http://localhost:11434"
ollama_model = "llama3.2"
anthropic_model = "claude-haiku-4-5"
server_url = ""                       # openai-compatible: the server address, e.g. "http://localhost:8080/v1"
server_model = ""                     # openai-compatible: the model name that the server expects
server_key_env = ""                   # openai-compatible: the variable that holds the API key; "" sends no key
polish = true                         # rewrite every transcript with the LLM; Command Mode works either way
max_tokens = 400
temperature = 0.3

[styles]
# Writing styles for one recording. A style key (hotkey.styles), `hush start
# --style NAME`, or profiles.app_styles picks one. prompt is one line that
# Hush adds to the polish prompt next to the tone of the application. polish
# turns the LLM polish on or off for the recording, whatever llm.polish says
# (default true). The rule-based cleanup always runs. A name uses lowercase
# letters, digits, - and _. "verbatim" is built in: it turns polish off, so
# you cannot use that name.
# A style with polish on and a prompt can also rewrite the selected text:
# see hotkey.rewrite and `hush rewrite NAME`.
# [styles.casual]
# prompt = "Casual and brief, like a chat message to a friend."
# [styles.formal]
# prompt = "Formal English with complete sentences and no contractions."

[hooks]
# A command that changes each transcript. Hush runs it with sh -c after
# polishing and before it types the text, also for Command Mode and a style
# rewrite. The text goes to stdin, and Hush types what the command prints,
# without one trailing newline. Exit code 77 types nothing, so a style
# rewrite leaves the selection as it is. When the command fails, prints
# nothing, or runs longer than 5 seconds, Hush types the original text.
# The command gets HUSH_APP (the window class), HUSH_PROFILE (terminal,
# editor, chat, mail, docs, browser, or other), HUSH_RAW_TEXT (the text as
# Whisper returned it, or the selected text for a style rewrite), and
# HUSH_TRIGGER (hotkey, ipc, tray, command, or rewrite).
# Use an absolute path: the daemon gets the PATH of your login session.
transcript = "" # e.g. "/usr/bin/tr -d '!'"; empty is off

[tray]
# Status icon on the desktop panel: click to start or stop dictation, with
# the same actions the hotkeys have. Needs a panel that speaks
# StatusNotifierItem (KDE and most panels do; GNOME needs the AppIndicator
# extension).
enabled = true

[updates]
# Once a day, ask GitHub for the number of the newest release and show a
# notification when it is newer than this one. The request sends nothing but
# the Hush version. AppImage and tarball installs only: a package manager
# updates its own installs, so those never check.
check = false

[gui]
# The colours of the settings window (`hush settings`). system follows the
# light or dark preference of the desktop, and changes when the desktop
# changes. When the desktop has no preference, the window is light.
appearance = "system" # system, light, dark
