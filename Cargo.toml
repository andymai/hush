[package]
name = "hush"
version = "0.1.0"
edition = "2021"
description = "Fast, accurate voice-to-text for Linux developers"
authors = ["andy"]
license = "TBD"
keywords = ["voice", "speech-to-text", "whisper", "linux"]
categories = ["multimedia::audio", "accessibility"]
default-run = "hush"

[features]
default = ["notifications", "system-tray", "cuda"]
notifications = ["dep:notify-rust"]
system-tray = ["dep:ksni"]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "whisper-rs/cuda"
]

[dependencies]
# Audio capture and processing
cpal = "0.15"  # Keep at 0.15 - 0.16 has breaking changes
hound = "3.5"
rodio = { version = "0.19", default-features = false, features = ["wav"] }

# Whisper integration (using candle for pure Rust)
# CUDA features are optional via the "cuda" feature flag
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
candle-transformers = { version = "0.8" }
tokenizers = "0.19"
hf-hub = { version = "0.3", features = ["tokio"] }
byteorder = "1.5"
safetensors = "0.4"
sha2 = "0.10"  # SHA256 checksum validation for model integrity

# Alternative whisper implementation
whisper-rs = { version = "0.15", features = ["tracing_backend"] }

# Text processing
regex = "1.10"  # Pattern matching for filler words

# LLM integration for text polishing
dotenvy = "0.15"  # Environment variable loading

# System integration
x11rb = "0.13"
enigo = "0.2"  # Keep at 0.2 - 0.6 has major breaking changes
libc = "0.2"
# Kernel-level keyboard emulation
input-linux = "0.7"

# Hotkey management
global-hotkey = "0.6"  # Keep at 0.6 - 0.7 may have breaking changes
winit = "0.29"

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive", "color", "help", "usage"] }

# Overlay GUI dependencies
egui = "0.23"  # Must match egui_overlay 0.5 dependency
egui_overlay = "0.5"
raw-window-handle = "0.5"  # For window creation

# System notifications (optional - requires libdbus)
notify-rust = { version = "4.10", optional = true }

# System tray integration (optional - requires libdbus)
ksni = { version = "0.2", optional = true }
arboard = "3.0"

# Application directories (XDG)
dirs = "5.0"  # Keep at 5.0 - 6.0 has breaking API changes

# Async runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-error = "0.2"
sysinfo = "0.37"  # Conservative update, 0.37 has breaking changes
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for downloading models
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
tempfile = "3.8"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "architecture_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Main application
[[bin]]
name = "hush"
path = "src/main.rs"

# Model management utilities
[[bin]]
name = "model-manager"
path = "src/bin/model-manager.rs"

[[bin]]
name = "simple-model-manager"
path = "src/bin/simple-model-manager.rs"

# Integration tests
[[bin]]
name = "test-overlay"
path = "src/bin/test-overlay.rs"

[[bin]]
name = "test-full-integration"
path = "src/bin/test-full-integration.rs"

[[bin]]
name = "test-intelligent-editing"
path = "src/bin/test-intelligent-editing.rs"

