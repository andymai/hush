[package]
name = "hush"
version = "0.1.0"
edition = "2021"
description = "Fast, accurate voice-to-text for Linux developers"
authors = ["Andy Aragon"]
license = "MIT"
keywords = ["voice", "speech-to-text", "whisper", "linux"]
categories = ["multimedia::audio", "accessibility"]
default-run = "hush"

[features]
default = []

# GPU acceleration features (mutually exclusive)
# CUDA for NVIDIA GPUs (Linux/Windows)
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "whisper-rs/cuda"
]


[dependencies]
# Audio capture and processing
cpal = "0.15"  # Keep at 0.15 - 0.16 has breaking changes
hound = "3.5"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
rubato = "0.16"  # High-quality audio resampling with sinc interpolation

# Whisper integration (using candle for pure Rust)
# CUDA features are optional via the "cuda" feature flag
candle-core = { version = "0.9" }
candle-nn = { version = "0.9" }
candle-transformers = { version = "0.9" }
tokenizers = "0.22"
hf-hub = { version = "0.4", features = ["tokio"] }
byteorder = "1.5"
safetensors = "0.7"
sha2 = "0.10"  # SHA256 checksum validation for model integrity
raw-cpuid = "11"  # CPU feature detection

# Alternative whisper implementation
whisper-rs = { version = "0.15", features = ["tracing_backend"] }

# Text processing
regex = "1.12"  # Pattern matching for filler words

# LLM integration for text polishing
dotenvy = "0.15"  # Environment variable loading

# System integration (cross-platform)
enigo = "0.6"
libc = "0.2"

# Hotkey management
global-hotkey = "0.7"
winit = "0.29"

# Configuration
toml = "0.9"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "color", "help", "usage"] }

# Overlay GUI dependencies
egui = "0.23"  # Must match egui_overlay 0.5 dependency
egui_overlay = "0.5"
raw-window-handle = "0.5"  # For window creation


# Clipboard (cross-platform)
arboard = "3.6"

# Application directories (XDG)
dirs = "5.0"  # Keep at 5.0 - 6.0 has breaking API changes

# Async runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

# Error handling and logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-error = "0.2"
sysinfo = "0.32"  # Conservative update, 0.37 has breaking changes
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for downloading models
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
tempfile = "3.23"
serde_json = "1.0"

# ============================================================================
# Platform-specific dependencies
# ============================================================================

[target.'cfg(target_os = "linux")'.dependencies]
# X11 window system
x11rb = "0.13"

# Kernel-level keyboard emulation (uinput)
input-linux = "0.7"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"

# Maximum optimization for final builds (slower compile)
[profile.production]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

# Main application
[[bin]]
name = "hush"
path = "src/main.rs"

