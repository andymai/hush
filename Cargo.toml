[package]
name = "hush"
version = "0.30.1"
edition = "2021"
description = "Local voice-to-text for Linux desktops"
authors = ["Andy Aragon"]
license = "MIT"
repository = "https://github.com/andymai/hush"
readme = "README.md"
rust-version = "1.95"
keywords = ["voice", "speech-to-text", "whisper", "linux"]
categories = ["multimedia::audio", "accessibility"]
default-run = "hush"

# Packaging: cargo deb and cargo generate-rpm read these; the release workflow
# runs both against the vulkan build.
[package.metadata.deb]
maintainer = "Andy Aragon"
copyright = "2025-2026, Andy Aragon"
license-file = ["LICENSE", "0"]
extended-description = """Hush runs OpenAI's Whisper models locally, on the GPU through Vulkan when \
one is present, and types the result at the cursor through uinput, so it works \
in every application, VM, and password field on X11 and Wayland."""
section = "utils"
priority = "optional"
# The release job fills in Depends with dpkg-shlibdeps on the unpacked package.
# cargo-deb's $auto runs it on each file outside a package tree, where it cannot
# follow $ORIGIN to the private libraries in /usr/lib/hush.
depends = ""
# Hush loads libxkbcommon with dlopen to type on every layout, and pastes without it.
recommends = "libxkbcommon0, xkb-data"
# libtranscribe and the ggml backend modules are private to Hush, in the folder
# that the binary's RUNPATH ($ORIGIN/../lib/hush) names.
assets = [
  [
    "target/release/hush",
    "usr/bin/",
    "755",
  ],
  [
    "target/release/lib/hush/*",
    "usr/lib/hush/",
    "644",
  ],
  [
    "packaging/io.github.andymai.hush.desktop",
    "usr/share/applications/",
    "644",
  ],
  [
    "packaging/io.github.andymai.hush.svg",
    "usr/share/icons/hicolor/scalable/apps/",
    "644",
  ],
  [
    "packaging/70-hush.rules",
    "usr/lib/udev/rules.d/",
    "644",
  ],
  [
    "packaging/hush.service",
    "usr/lib/systemd/user/",
    "644",
  ],
  [
    "README.md",
    "usr/share/doc/hush/README.md",
    "644",
  ],
]

[package.metadata.generate-rpm]
license = "MIT"
summary = "Local voice-to-text for Linux desktops"
auto-req = "disabled"
assets = [
  { source = "target/release/hush", dest = "/usr/bin/hush", mode = "755" },
  { source = "target/release/lib/hush/*", dest = "/usr/lib/hush/", mode = "644" },
  { source = "packaging/io.github.andymai.hush.desktop", dest = "/usr/share/applications/io.github.andymai.hush.desktop", mode = "644" },
  { source = "packaging/io.github.andymai.hush.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.andymai.hush.svg", mode = "644" },
  { source = "packaging/70-hush.rules", dest = "/usr/lib/udev/rules.d/70-hush.rules", mode = "644" },
  { source = "packaging/hush.service", dest = "/usr/lib/systemd/user/hush.service", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/hush/README.md", mode = "644", doc = true },
]

# auto-req would list the private libraries in /usr/lib/hush as requirements.
[package.metadata.generate-rpm.requires]
vulkan-loader = "*"
alsa-lib = "*"
libX11 = "*"

[package.metadata.generate-rpm.recommends]
libxkbcommon = "*"
xkeyboard-config = "*"

[features]
default = []

# The GPU backend module of transcribe.cpp, one of the two. Release packages use
# vulkan, which runs on NVIDIA, AMD, and Intel with only the graphics driver.
cuda = ["transcribe-cpp/cuda"]
vulkan = ["transcribe-cpp/vulkan"]

[dependencies]
# Audio capture and processing
cpal = "0.18"
claxon = "0.4" # FLAC decoding
flacenc = { version = "0.5", default-features = false } # FLAC encoding for kept audio
hound = "3.5"
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "wav",
] }
rubato = "5.0"

sha2 = "0.11"        # SHA256 checksum validation for model integrity
indicatif = "0.18"   # Model download progress
futures-util = "0.3" # Streaming download bodies

# transcribe.cpp runs the speech models on ggml. With dynamic-backends,
# libtranscribe is a shared library, and each ggml backend is a module that it
# loads at run time: one CPU module for each x86 level, from which ggml picks
# the best for this CPU, and the GPU module of the cuda or vulkan feature.
# build.rs puts them in target/<profile>/lib/hush. Builds set
# TRANSCRIBE_CMAKE_ARGS to -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF (Makefile, CI), so no
# OpenBLAS is linked.
transcribe-cpp = { version = "0.4.1", default-features = false, features = [
  "dynamic-backends",
] }

# Text processing
regex = "1.12" # Pattern matching for filler words

# LLM integration for text polishing
dotenvy = "0.15" # Environment variable loading

# Hotkey management
global-hotkey = "0.9"

# Desktop notifications over D-Bus (pure Rust through zbus)
notify-rust = { version = ">=4.17, <4.19", default-features = false, features = [
  "z",
] }
zbus = { version = "5", default-features = false, features = [
  "blocking-api",
] } # KWin window queries

# Configuration
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "color", "help", "usage"] }

# Overlay GUI dependencies
egui = "0.29"
egui_overlay = "0.9"
raw-window-handle = "0.6"

# Application directories (XDG)
dirs = "7.0"

# Async runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

# Error handling and logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2" # transcribe.cpp logs through the log crate
tracing-appender = "0.2"
sysinfo = { version = "0.40", features = [
  "multithread",
] } # the startup log walks every process, about 8x slower single-threaded
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for model downloads, LLM polishing, and cloud transcription
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
  "multipart",
] }

# Utilities
once_cell = "1.19"
parking_lot = "0.13"
tempfile = "3.23"
serde_json = "1.0"
evdev = "0.13"
libc = "0.2"
arboard = { version = "3.6", default-features = false, features = [
  "wayland-data-control",
] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
eframe = { version = "0.29", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
# PNG output for `HUSH_SETTINGS_SCREENSHOT`, with the features eframe already uses
image = { version = "0.25", default-features = false, features = ["png"] }

# ============================================================================
# Platform-specific dependencies
# ============================================================================

[target.'cfg(target_os = "linux")'.dependencies]
# X11 window system; xkb reads the active layout on X11 sessions
x11rb = { version = "0.14", features = ["xkb"] }

# Kernel-level keyboard emulation (uinput)
input-linux = "0.7"

# The session's XKB keymap, to type on every layout. Hush loads libxkbcommon
# with dlopen, so Hush runs, and pastes, without it.
xkbcommon-dl = "0.4"

# Every clipboard format through Wayland data-control, for the paste restore
wl-clipboard-rs = "0.9"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"

# Maximum optimization for final builds (slower compile)
[profile.production]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

# Main application
[[bin]]
name = "hush"
path = "src/main.rs"
