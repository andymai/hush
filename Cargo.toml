[package]
name = "hush"
version = "0.1.0"
edition = "2021"
description = "Fast, accurate voice-to-text for Linux developers"
authors = ["andy"]
license = "TBD"
keywords = ["voice", "speech-to-text", "whisper", "linux"]
categories = ["multimedia::audio", "accessibility"]

[features]
default = ["notifications"]
notifications = []

[dependencies]
# Audio capture and processing  
cpal = "0.15"
hound = "3.5"
rodio = { version = "0.17", default-features = false, features = ["wav"] }

# Whisper integration (using candle for pure Rust)
candle-core = { version = "0.8", features = ["cuda"] }
candle-nn = { version = "0.8", features = ["cuda"] }
candle-transformers = { version = "0.8", features = ["cuda"] }
tokenizers = "0.19"
hf-hub = { version = "0.3", features = ["tokio"] }
byteorder = "1.5"
safetensors = "0.4"

# Alternative whisper implementation
whisper-rs = { version = "0.15", features = ["tracing_backend", "cuda"] }

# Text processing
regex = "1.10"  # Pattern matching for filler words

# LLM integration (optional, for future enhancement)
# llama-cpp-2 = "0.1"  # Disabled until API is stabilized

# System integration
x11rb = "0.13"
enigo = "0.2"
libc = "0.2"
# Kernel-level keyboard emulation
input-linux = "0.7"

# Hotkey management
global-hotkey = "0.6"
winit = "0.29"

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive", "color", "help", "usage"] }

# TUI dependencies
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-input = "0.10"

# Overlay GUI dependencies
egui = "0.23"  # Must match egui_overlay 0.5 dependency
egui_overlay = "0.5"

# System notifications
notify-rust = "4.10"

# System tray integration
ksni = "0.2"
arboard = "3.0"

# Application directories (XDG)
dirs = "5.0"

# Async runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-error = "0.2"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for downloading models
reqwest = { version = "0.11", features = ["stream"] }
futures-util = "0.3"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
tempfile = "3.8"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "architecture_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# Main application
[[bin]]
name = "hush"
path = "src/main.rs"

# Model management utilities
[[bin]]
name = "model-manager"
path = "src/bin/model-manager.rs"

[[bin]]
name = "simple-model-manager"
path = "src/bin/simple-model-manager.rs"

# Integration tests
[[bin]]
name = "test-overlay"
path = "src/bin/test-overlay.rs"

[[bin]]
name = "test-full-integration"
path = "src/bin/test-full-integration.rs"

[[bin]]
name = "test-intelligent-editing"
path = "src/bin/test-intelligent-editing.rs"

