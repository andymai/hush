# chrono: hush uses it directly for DateTime<Utc> timestamps, and no fixed
# release exists. It leaves when hush moves off chrono.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "unmaintained chrono, a direct dependency for DateTime<Utc> timestamps; no fixed release; removed when hush moves off chrono"

# heapless 0.8: pulled by flacenc 0.5.1, the latest release, which requires
# heapless ^0.8.0, so the 0.9.4 fix is out of range. flacenc uses only
# heapless::Vec, of u8, i32 and f32/f64 (LpcFloat), which have no Drop. The
# advisories cover FindMutView, Spsc, IndexMap, SortedLinkedList, Deque, the
# treiber pool, and dropping elements whose Drop panics. They leave when
# flacenc moves to heapless 0.9.4.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0574"
ignoreUntil = 2027-03-01
reason = "heapless 0.8 FindMutView::pop via flacenc 0.5.1, which uses only heapless::Vec; removed when flacenc moves to heapless 0.9.4"

