# latest releases) still require zbus ^5. They leave with the move to zbus 6.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "unmaintained zvariant via zbus 5, merged into zbus 6; removed when hush, ksni and notify-rust move to zbus 6"

