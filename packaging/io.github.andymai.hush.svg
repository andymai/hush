<?xml version="1.0" encoding="UTF-8"?>
<!-- The Hush mark: the five-bar waveform the overlay animates while recording,
     which the tray icon draws in code at small sizes. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hush-ground" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b4bdb"/>
      <stop offset="1" stop-color="#8b3ee0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#hush-ground)"/>
  <g fill="#ffffff">
    <rect x="29.18" y="50.94" width="8.70" height="26.11" rx="4.35"/>
    <rect x="44.41" y="40.50" width="8.70" height="47.00" rx="4.35"/>
    <rect x="59.65" y="30.06" width="8.70" height="67.89" rx="4.35"/>
    <rect x="74.88" y="40.50" width="8.70" height="47.00" rx="4.35"/>
    <rect x="90.11" y="50.94" width="8.70" height="26.11" rx="4.35"/>
  </g>
</svg>
