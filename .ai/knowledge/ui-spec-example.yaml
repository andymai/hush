# UI Component Specification Format
# Machine-readable format for AI agents implementing UI

overlay_idle:
  type: "window"
  geometry:
    width: 60
    height: 4
    position: "bottom-center"
    offset_from_edge: 32
  appearance:
    shape: "pill"  # rounded rectangle
    border_radius: 2  # height / 2 for perfect pill
    background:
      color: "#000000"
      opacity: 0.75
      blur: null
    border:
      width: 1
      color: "#FFFFFF"
      opacity: 0.2
    shadow:
      offset_x: 0
      offset_y: 4
      blur: 12
      color: "#000000"
      opacity: 0.3
  animation:
    hover:
      scale: 1.05
      duration: 150
      easing: "ease-out"
    pulse:
      property: "opacity"
      from: 0.75
      to: 0.85
      duration: 1000
      loop: true
      easing: "ease-in-out"
  interaction:
    cursor: "pointer"
    clickable: true
    action: "expand_to_recording"

overlay_recording:
  type: "window"
  geometry:
    width: 80
    height: 24
    position: "bottom-center"
    offset_from_edge: 32
  appearance:
    shape: "pill"
    border_radius: 12
    background:
      color: "#4CAF8C"  # sage green
      opacity: 0.95
    shadow:
      offset_x: 0
      offset_y: 6
      blur: 20
      color: "#4CAF8C"
      opacity: 0.4
  children:
    - type: "waveform"
      id: "audio_waveform"
      geometry:
        width: "100%"
        height: "100%"
        padding: 4
      bars:
        count: 12
        width: 2.5
        spacing: 1
        color: "#FFFFFF"
        height_min: 3
        height_max: 16
      animation:
        frequency: 10  # Hz
        phase_offset: 0.2  # per bar
        fps: 20
  transition_from: "overlay_idle"
  transition:
    duration: 200
    easing: "ease-out"
    properties: ["width", "height", "background-color"]

settings_window:
  type: "window"
  geometry:
    width: 800
    height: 600
    min_width: 600
    min_height: 400
    resizable: true
    position: "center"
  appearance:
    background: "#FFFFFF"  # light mode
    dark_background: "#1C1C1E"  # dark mode
    border_radius: 12
    shadow:
      offset_x: 0
      offset_y: 12
      blur: 48
      color: "#000000"
      opacity: 0.2
  children:
    - type: "title_bar"
      id: "title_bar"
      geometry:
        height: 48
        width: "100%"
      appearance:
        background: "#FAF8F5"
        border_bottom:
          width: 1
          color: "#000000"
          opacity: 0.1
      children:
        - type: "text"
          id: "title"
          content: "Hush Settings"
          style:
            font_size: 16
            font_weight: 600
            color: "#1A1A1A"
          geometry:
            padding_left: 16
            align: "left"
        - type: "button"
          id: "close_button"
          icon: "x"
          geometry:
            width: 32
            height: 32
            align: "right"
            margin_right: 8
          action: "close_window"

    - type: "tab_bar"
      id: "main_tabs"
      geometry:
        height: 40
        width: "100%"
      tabs:
        - id: "general"
          label: "General"
          active: true
        - id: "models"
          label: "Models"
        - id: "audio"
          label: "Audio"
        - id: "hotkeys"
          label: "Hotkeys"
        - id: "advanced"
          label: "Advanced"
      appearance:
        background: "#FFFFFF"
        border_bottom:
          width: 1
          color: "#000000"
          opacity: 0.1
        tab_inactive:
          color: "#666666"
          font_size: 13
          font_weight: 500
        tab_hover:
          color: "#4CAF8C"
          background:
            color: "#4CAF8C"
            opacity: 0.1
        tab_active:
          color: "#4CAF8C"
          border_bottom:
            width: 2
            color: "#4CAF8C"
      animation:
        transition: 150
        easing: "ease-out"

    - type: "content_area"
      id: "content"
      geometry:
        padding: 24
        max_width: 600
        center: true
      # Content varies by active tab

button_primary:
  type: "button"
  geometry:
    height: 36
    padding_horizontal: 20
    border_radius: 8
  appearance:
    background: "#4CAF8C"  # sage green
    color: "#FFFFFF"
    font_size: 13
    font_weight: 500
    shadow:
      offset_x: 0
      offset_y: 2
      blur: 4
      color: "#000000"
      opacity: 0.1
  states:
    hover:
      background: "#3D9E7A"  # darker green
      shadow:
        offset_y: 3
        blur: 6
      transition: 150
    active:
      background: "#2E8B68"  # even darker
      shadow:
        offset_y: 1
        blur: 2
      scale: 0.98
      transition: 100
    disabled:
      background: "#CCCCCC"
      color: "#999999"
      cursor: "not-allowed"

# This format allows AI to:
# 1. Parse exact measurements
# 2. Understand relationships (parent/child)
# 3. Generate code directly
# 4. Validate against schema
# 5. Calculate derived values (like perfect pill radius)
